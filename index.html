<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Dashboard - MedDash</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        
        <aside class="sidebar">
            <div class="logo">
                <h2><i class="fa-solid fa-notes-medical"></i> MedDash</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="active"><a href="#"><i class="fa-solid fa-border-all"></i> Dashboard</a></li>
                    <li><a href="#"><i class="fa-regular fa-calendar-check"></i> Appointments</a></li>
                    <li><a href="#"><i class="fa-solid fa-user-doctor"></i> Doctors</a></li>
                    <li><a href="#"><i class="fa-solid fa-bed-pulse"></i> Patients</a></li>
                    <li><a href="#"><i class="fa-regular fa-message"></i> Messages</a></li>
                </ul>
            </nav>
            <div class="sidebar-bottom">
                <a href="#" class="settings-link"><i class="fa-solid fa-gear"></i> Settings</a>
            </div>
        </aside>

        <div class="main-content">
            <header class="header">
                <div class="search-box">
                    <input type="text" placeholder="Пошук пацієнтів, лікарів, карт...">
                </div>
                <div class="user-profile">
                    <span class="user-name">Микита Шевченко</span>
                    <div class="user-avatar">НШ</div>
                </div>
            </header>

            <main class="content-body">
                <div class="welcome-banner">
                    <h1>Health Overview</h1>
                    <p style="color: #828282;">August 12, 2021</p>
                </div>
                
                <div class="dashboard-grid">
                    
                    <div class="card">
                        <div class="card-header">
                            <div class="icon-box orange">
                                <i class="fa-solid fa-droplet"></i>
                            </div>
                            <h3>Blood Sugar</h3>
                        </div>
                        <div class="card-value">
                            <h2>80</h2>
                            <span>mg / dL</span>
                        </div>
                        <div class="card-status">
                            <span class="dot orange-dot"></span> Normal
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <div class="icon-box red">
                                <i class="fa-solid fa-heart-pulse"></i>
                            </div>
                            <h3>Heart Rate</h3>
                        </div>
                        <div class="card-value">
                            <h2>98</h2>
                            <span>bpm</span>
                        </div>
                        <div class="card-status">
                            <span class="dot red-dot"></span> Normal
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header">
                            <div class="icon-box blue">
                                <i class="fa-solid fa-tint"></i>
                            </div>
                            <h3>Blood Pressure</h3>
                        </div>
                        <div class="card-value">
                            <h2>102</h2>
                            <span>/ 72 mmHg</span>
                        </div>
                        <div class="card-status">
                            <span class="dot blue-dot"></span> Normal
                        </div>
                    </div>

                </div>
            </main>
        </div>

    </div>
</body>
</html>
